<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Complaint System</title>
    <link rel="stylesheet" href="css/style.css"> </head>
<body>
    <div class="container">
        <header>
            <h2 id="welcomeMessage">Welcome to Your Dashboard!</h2>
            <button id="logoutButton" class="logout-btn">Logout</button>
        </header>

        <section class="complaint-submission">
            <h3>Submit a New Complaint</h3>
            <form id="complaintForm">
                <div class="form-group">
                    <label for="complaintTitle">Complaint Title:</label>
                    <input type="text" id="complaintTitle" name="title" required>
                </div>
                <div class="form-group">
                    <label for="complaintDescription">Description:</label>
                    <textarea id="complaintDescription" name="description" rows="5" required></textarea>
                </div>
                <button type="submit">Submit Complaint</button>
            </form>
        </section>

        <section class="my-complaints">
            <h3>Your Submitted Complaints</h3>
            <div id="complaintsList">
                <p>Loading complaints...</p>
            </div>
        </section>
    </div>

    <script src="js/common.js"></script> <script src="js/dashboard.js"></script>
</body>
</html>
